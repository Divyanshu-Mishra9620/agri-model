services:
  - type: web
    name: agri-ml-service
    runtime: docker
    region: oregon
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ML_SERVICE_API_KEY
        sync: false
      - key: MODEL_DOWNLOAD_URL
        value: https://github.com/Divyanshu-Mishra9620/agri-model/releases/download/model-v1/model.torchscript.pt
